name: Test action with labels and comment inputs
on:
  workflow_dispatch:
jobs:
  test-with-labels-and-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a real GitHub token and issue number.
      # With an invalid token, the gh CLI step should fail.
      # We use continue-on-error to capture the failure and assert it failed as expected.
      # This test exercises the labels and comment code paths in the params step.
      - name: Run action with labels and comment (expect failure due to invalid token)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: invalid-token
          repository: peter-evans/close-issue
          issue-number: "99999"
          close-reason: completed
          comment: "Closing this issue as it has been resolved."
          labels: |
            bug
            resolved

      - name: Assert action failed (gh CLI fails with invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token when labels and comment provided"
