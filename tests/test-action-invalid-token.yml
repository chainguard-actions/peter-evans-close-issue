name: Test action fails gracefully with invalid token
on:
  workflow_dispatch:
jobs:
  test-invalid-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a real GitHub token and issue number to close an issue.
      # With an invalid token, the gh CLI step should fail.
      # We use continue-on-error to capture the failure and assert it failed as expected.
      - name: Run action with invalid token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: invalid-token
          repository: peter-evans/close-issue
          issue-number: "99999"
          close-reason: completed

      - name: Assert action failed due to invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"
